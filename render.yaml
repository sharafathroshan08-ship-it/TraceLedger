# Render Blueprint: one-click deploy of the full TraceLedger demo.
#
# Creates two free web services:
#   traceledger-demo-web  Next.js frontend (public URL)
#   traceledger-demo-api  FastAPI backend (reached by the frontend proxy)
#
# The frontend rewrites /api/* to the backend over HTTPS, so the browser only
# ever talks to one origin and the HttpOnly session cookie stays first-party.
# No CORS or SameSite=None workaround is needed.
#
# Free instances sleep after inactivity. The first request may take ~40s while
# both services cold start. Render's free plan has no persistent disk, so the
# SQLite file is recreated on restart; set TRACELEDGER_DATABASE_URL in the
# dashboard afterwards if workspaces must survive deploys.
#
# If Render renames a service because its onrender.com subdomain is taken,
# update TRACELEDGER_API_PROXY / TRACELEDGER_ALLOWED_ORIGINS to match.
services:
  - type: web
    name: traceledger-demo-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-postgres.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TRACELEDGER_COOKIE_SECURE
        value: "true"
      - key: TRACELEDGER_ALLOWED_ORIGINS
        value: https://traceledger-demo-web.onrender.com

  - type: web
    name: traceledger-demo-web
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # "/" normalizes to an empty base, i.e. same-origin /api requests.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /
      # Build-time rewrite target. Must point at the API service's public URL.
      - key: TRACELEDGER_API_PROXY
        value: https://traceledger-demo-api.onrender.com
